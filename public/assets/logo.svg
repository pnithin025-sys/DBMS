<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pixora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="pixora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Rounded Aperture Hexagon -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#pixora-grad)" filter="url(#pixora-glow)" opacity="0.3"/>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#pixora-grad)"/>
  <!-- Inner Dynamic Lens Shutter -->
  <circle cx="24" cy="24" r="14" fill="#0B0F19" />
  <circle cx="24" cy="24" r="11" fill="none" stroke="url(#pixora-grad)" stroke-width="2.5" />
  <circle cx="24" cy="24" r="5" fill="url(#pixora-grad)" />
  <circle cx="31" cy="17" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>
