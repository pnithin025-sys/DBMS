<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixora – Visual Social Media & Community</title>
    <meta name="description" content="Pixora is a modern social media platform for sharing photos, multi-image carousels, vertical reels, 24-hour stories, and real-time messaging.">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layouts.css">
</head>
<body>
    <!-- SVG Sprite Embed -->
    <div style="display:none;" id="svg-sprite-holder"></div>

    <!-- Main Single Page Application Root -->
    <div id="app-root">
        <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-base);">
            <div style="text-align:center;">
                <img src="/assets/logo.svg" width="64" height="64" style="margin:0 auto 16px; animation:spin 2s linear infinite;">
                <h3 style="font-size:20px; font-weight:800; background:var(--brand-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Loading Pixora...</h3>
            </div>
        </div>
    </div>

    <!-- Global Modal Overlay -->
    <div id="app-modal-overlay" class="modal-overlay" onclick="if(event.target === this) App.closeModal()">
        <div id="app-modal-content" class="modal-content"></div>
    </div>

    <!-- Fullscreen Story Viewer Modal -->
    <div id="story-viewer-modal"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Socket.IO Library -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Load SVG Sprites into DOM -->
    <script>
        fetch('/assets/icons.svg')
            .then(res => res.text())
            .then(svgText => {
                const holder = document.getElementById('svg-sprite-holder');
                if (holder) holder.innerHTML = svgText;
            })
            .catch(err => console.warn('Failed loading SVG icon sprite:', err));
    </script>

    <!-- Application Script Modules -->
    <script src="/js/api.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/feed.js"></script>
    <script src="/js/explore.js"></script>
    <script src="/js/reels.js"></script>
    <script src="/js/stories.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/messages.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
